<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumière Studio — Salón de Belleza Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --cream:#faf7f4;
  --warm:#f0e8df;
  --blush:#e8cfc5;
  --rose:#c9906e;
  --gold:#b89a6a;
  --espresso:#1a1410;
  --charcoal:#2d2420;
  --mist:#7a6e68;
  --white:#ffffff;

  --font-display:'Cormorant Garamond', serif;
  --font-body:'Jost', sans-serif;
}

html {
  scroll-behavior:smooth;
}

body {
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--charcoal);
  overflow-x:hidden;
}

section {
  padding:100px 5vw;
}
</style>
